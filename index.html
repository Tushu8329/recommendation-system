code: String.raw`import heapq

graph = {
    'A': [('B', 1), ('C', 4)],
    'B': [('D', 2), ('E', 5)],
    'C': [('F', 3)],
    'D': [('G', 3)],
    'E': [('G', 2)],
    'F': [('G', 2)],
    'G': []
}

# BFS
def bfs(start, goal):
    q = [[start]]
    while q:
        p = q.pop(0)
        n = p[-1]
        if n == goal:
            return p
        for v, c in graph[n]:
            if v not in p:
                q.append(p + [v])

# DFS
def dfs(start, goal):
    s = [[start]]
    while s:
        p = s.pop()
        n = p[-1]
        if n == goal:
            return p
        for v, c in graph[n]:
            if v not in p:
                s.append(p + [v])

# UCS
def ucs(start, goal):
    q = [(0, [start])]
    while q:
        cost, p = heapq.heappop(q)
        n = p[-1]
        if n == goal:
            return p, cost
        for v, c in graph[n]:
            if v not in p:
                heapq.heappush(q, (cost+c, p+[v]))

# A*

def astar(start, goal):

        for v, c in graph[n]:
            if v not in p:
                ng = g + c
                heapq.heappush(q, (ng+h[v], ng, p+[v]))

def minimax(tree, depth, isMax):

        for child in tree:

facts = {"Human(Socrates)"}

rules = {
    "Mortal(Socrates)": ["Human(Socrates)"]

    if goal in rules:

code: String.raw`# STRIPS-based AI Planning (Blocks World)

# Initial State and Goal State
initial = {"On(A,Table)", "On(B,Table)", "Clear(A)", "Clear(B)", "HandEmpty"}
goal = {"On(A,B)"}

# Actions: preconditions, add list, delete list
actions = {
    "Pickup(A)": {
        "pre": {"On(A,Table)", "Clear(A)", "HandEmpty"},
        "add": {"Holding(A)"},
        "delete": {"On(A,Table)", "Clear(A)", "HandEmpty"}
    },
    "Pickup(B)": {
        "pre": {"On(B,Table)", "Clear(B)", "HandEmpty"},
        "add": {"Holding(B)"},
        "delete": {"On(B,Table)", "Clear(B)", "HandEmpty"}
    },
    "Stack(A,B)": {
        "pre": {"Holding(A)", "Clear(B)"},
        "add": {"On(A,B)", "Clear(A)", "HandEmpty"},
        "delete": {"Holding(A)", "Clear(B)"}
    },
    "Stack(B,A)": {
        "pre": {"Holding(B)", "Clear(A)"},
        "add": {"On(B,A)", "Clear(B)", "HandEmpty"},
        "delete": {"Holding(B)", "Clear(A)"}
    }
}

# Planner (BFS over states)
def plan(initial, goal):
    queue = [(initial, [])]
    visited = [initial]

    while queue:
        state, steps = queue.pop(0)

        if goal <= state:
            return steps

        for name, a in actions.items():
            if a["pre"] <= state:
                new_state = (state - a["delete"]) | a["add"]
                if new_state not in visited:
                    visited.append(new_state)
                    queue.append((new_state, steps + [name]))

    return None

print("Initial State:", initial)
print("Goal State:", goal)

result = plan(initial, goal)

print("\nPlan:")
for i, step in enumerate(result, 1):
    print(i, step)
`

const list = document.getElementById("practicalList");

function render(items) {

    list.innerHTML = "";

    items.forEach((p) => {

        const idx = practicals.indexOf(p);

        const card = document.createElement("div");
        card.className = "practical";

        card.innerHTML = `
            <h2>Practical ${idx + 1}: ${p.name}</h2>

            <div class="meta">
                <span class="tag">${p.level} Level</span>
                <span class="tag">Skill: ${p.skill}</span>
                <span class="tag">${p.co}</span>
                <span class="tag">${p.marks} ISE Marks</span>
            </div>

            <div class="info">
                <strong>Aim:</strong> ${p.aim}
            </div>

            <div class="info">
                <strong>About:</strong> ${p.description}
            </div>

            <div class="info">
                <strong>Important Concepts:</strong> ${p.concepts}
            </div>

            <div class="info">
                <strong>Python Code:</strong>
            </div>

            <textarea id="code${idx}" spellcheck="false"
            placeholder="# Paste your Python code here..."></textarea>

            <div class="actions">
                <button class="copy" id="copyBtn${idx}" onclick="copyCode(${idx})">
                    📋 Copy Code
                </button>

                <button class="clear" onclick="clearCode(${idx})">
                    Clear Code
                </button>
            </div>
        `;

        list.appendChild(card);

        // Fill saved code and keep it in sync with edits
        const ta = card.querySelector("textarea");
        ta.value = p.code;
        ta.addEventListener("input", () => { p.code = ta.value; });
    });
}

function copyCode(index) {

    const code = document.getElementById("code" + index).value;
    const btn = document.getElementById("copyBtn" + index);

    if (!code.trim()) {
        alert("Please add code before copying!");
        return;
    }

    const showDone = () => {
        btn.textContent = "✅ Copied!";
        btn.classList.add("done");
        setTimeout(() => {
            btn.textContent = "📋 Copy Code";
            btn.classList.remove("done");
        }, 1500);
    };

    const fallback = () => {
        const ta = document.getElementById("code" + index);
        ta.select();
        try {
            document.execCommand("copy");
            showDone();
        } catch (e) {
            alert("Copy failed. Please copy manually.");
        }
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(showDone).catch(fallback);
    } else {
        fallback();
    }
}

function clearCode(index) {

    if (confirm("Are you sure you want to clear this code?")) {
        document.getElementById("code" + index).value = "";
        practicals[index].code = "";
    }
}

document.getElementById("search").addEventListener("input", function() {

    const value = this.value.toLowerCase().trim();

    const filtered = practicals.filter((p, i) =>
        p.name.toLowerCase().includes(value) ||
        p.level.toLowerCase().includes(value) ||
        p.aim.toLowerCase().includes(value) ||
        String(i + 1) === value
    );

    render(filtered);
});

render(practicals);
